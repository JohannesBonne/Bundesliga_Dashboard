
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bundesliga Dashboard</title>

<style>
:root {
    color-scheme: dark;
    --bg: #111111;
    --panel: #1c1c1c;
    --line: #383838;
    --muted: #a6a6a6;
    --accent: #e30613;
    --text: #ffffff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 14px;
    background: linear-gradient(145deg, #111111, #242424);
    color: var(--text);
    font: 14px/1.45 system-ui, Segoe UI, Arial, sans-serif;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
}

h1 {
    font-size: 19px;
    margin: 0;
    font-weight: 750;
    letter-spacing: .2px;
}

.sub {
    font-size: 11px;
    color: var(--muted);
}

.pill {
    font-size: 10px;
    color: #ffffff;
    border: 1px solid #a9000b;
    background: #e30613;
    border-radius: 99px;
    padding: 4px 8px;
    white-space: nowrap;
}

.grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 11px;
}

section {
    background: rgba(28, 28, 28, .96);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 12px;
    min-width: 0;
}

h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: #ffffff;
    margin: 0 0 9px;
}

.muted {
    color: var(--muted);
}

.matches {
    display: grid;
    gap: 7px;
}

.match {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 7px;
    padding: 8px 9px;
    border-radius: 9px;
    background: #292929;
}

.match.sch-match {
    border: 1px solid #e30613;
    background: #351719;
}

.team {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.team:last-child {
    text-align: right;
}

.score {
    font-weight: 800;
    font-size: 15px;
    white-space: nowrap;
}

.time {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
}

.live {
    color: #ff3542;
    font-weight: 700;
}

.finished {
    color: #bdbdbd;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

th {
    color: var(--muted);
    font-weight: 600;
    text-align: right;
    padding: 5px 3px;
}

th:nth-child(2),
td:nth-child(2) {
    text-align: left;
}

td {
    padding: 6px 3px;
    border-top: 1px solid #383838;
    text-align: right;
    font-variant-numeric: tabular-nums;
}

tr.sch td {
    color: #ffffff;
    font-weight: 750;
    background: #4a171b;
}

.pos {
    width: 20px;
    color: var(--muted);
    text-align: left !important;
}

.teamcell {
    max-width: 145px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.footer {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
    font-size: 10px;
    color: var(--muted);
}

a {
    color: #ff4b55;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

.status {
    font-size: 11px;
    color: var(--muted);
    padding: 3px 0;
}

.empty {
    color: var(--muted);
    padding: 10px 2px;
}

@media (min-width: 600px) {
    .grid {
        grid-template-columns: 1.1fr .9fr;
    }

    .grid section:first-child {
        grid-column: 1 / -1;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <h1>Bundesliga</h1>
        <div class="sub">Spieltag · Ergebnisse · Tabelle</div>
    </div>

    <span class="pill">LIVE-DATEN</span>
</header>

<div class="grid">

    <section>
        <h2>Aktuelle & neue Spiele</h2>

        <div id="matches" class="matches">
            <div class="empty">Lade Spieldaten ...</div>
        </div>
    </section>

    <section>
        <h2>Tabelle 2026/27</h2>

        <div id="tableWrap" class="status">
            Lade Tabelle ...
        </div>
    </section>

</div>

<div class="footer">
    <span id="updated">Datenquelle: OpenLigaDB</span>

    <a href="https://www.openligadb.de/"
       target="_blank"
       rel="noopener noreferrer">
        Datenquelle ↗
    </a>
</div>

<script>
const API = 'https://api.openligadb.de';
const season = 2026;

const $ = id => document.getElementById(id);


// HTML-Sonderzeichen sicher darstellen
function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[char]);
}


// Ergebnis eines Spiels ermitteln
function getResult(match) {
    const results = (match.matchResults || [])
        .filter(result =>
            result.resultTypeID === 2 ||
            result.resultTypeID === 1
        )
        .sort((a, b) => b.resultTypeID - a.resultTypeID);

    const result = results[0];

    return result
        ? `${result.pointsTeam1} : ${result.pointsTeam2}`
        : '– : –';
}


// Spielstatus ermitteln
function getStatus(match) {
    if (match.matchIsFinished) {
        return '<span class="finished">Beendet</span>';
    }

    const date = new Date(match.matchDateTime);
    const now = new Date();

    if (date <= now) {
        return '<span class="live">● LIVE / Offen</span>';
    }

    return esc(
        date.toLocaleDateString('de-DE', {
            weekday: 'short',
            day: '2-digit',
            month: '2-digit'
        })
    ) + ' · ' + esc(
        date.toLocaleTimeString('de-DE', {
            hour: '2-digit',
            minute: '2-digit'
        })
    );
}


// Spiele anzeigen
function renderMatches(data) {

    const now = new Date();

    // Kommende und noch nicht abgeschlossene Spiele
    const upcoming = data
        .filter(match => !match.matchIsFinished)
        .sort((a, b) =>
            new Date(a.matchDateTime) -
            new Date(b.matchDateTime)
        );

    // Zuletzt abgeschlossene Spiele
    const recent = data
        .filter(match => match.matchIsFinished)
        .sort((a, b) =>
            new Date(b.matchDateTime) -
            new Date(a.matchDateTime)
        )
        .slice(0, 2);

    // Letzte zwei Spiele und nächste sechs Spiele
    const next = upcoming.slice(0, 6);

    const shown = [
        ...recent.reverse(),
        ...next
    ];

    if (!shown.length) {
        $('matches').innerHTML =
            '<div class="empty">Aktuell keine Spiele vorhanden.</div>';
        return;
    }

    $('matches').innerHTML = shown.map(match => {

        const home = match.team1?.teamName || 'Heim';
        const away = match.team2?.teamName || 'Gast';

        // Schalke-Spiele hervorheben
        const isSchalke =
            /schalke/i.test(home + ' ' + away);

        const score =
            match.matchIsFinished ||
            new Date(match.matchDateTime) <= now
                ? getResult(match)
                : 'vs';

        return `
            <div class="match ${isSchalke ? 'sch-match' : ''}">
                <div class="team">${esc(home)}</div>

                <div>
                    <div class="score" style="text-align:center">
                        ${esc(score)}
                    </div>

                    <div class="time">
                        ${getStatus(match)}
                    </div>
                </div>

                <div class="team">${esc(away)}</div>
            </div>
        `;

    }).join('');
}


// Bundesliga-Tabelle anzeigen
function renderTable(rows) {

    if (!rows || !rows.length) {
        $('tableWrap').textContent =
            'Tabelle derzeit nicht verfügbar.';
        return;
    }

    $('tableWrap').innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Verein</th>
                    <th>Sp</th>
                    <th>TD</th>
                    <th>Pkt</th>
                </tr>
            </thead>

            <tbody>
                ${rows.map((team, index) => {

                    const isSchalke =
                        /schalke/i.test(team.teamName || '');

                    return `
                        <tr class="${isSchalke ? 'sch' : ''}">
                            <td class="pos">${index + 1}</td>

                            <td class="teamcell">
                                ${esc(team.teamName)}
                            </td>

                            <td>${team.matches}</td>

                            <td>
                                ${team.goalDiff > 0 ? '+' : ''}${team.goalDiff}
                            </td>

                            <td><b>${team.points}</b></td>
                        </tr>
                    `;

                }).join('')}
            </tbody>
        </table>
    `;
}


// Daten von OpenLigaDB laden
async function load() {

    try {

        const [matchResponse, tableResponse] =
            await Promise.all([

                fetch(`${API}/getmatchdata/bl1/${season}`),

                fetch(`${API}/getbltable/bl1/${season}`)

            ]);

        if (!matchResponse.ok) {
            throw new Error('Spieldaten konnten nicht geladen werden.');
        }

        if (!tableResponse.ok) {
            throw new Error('Tabelle konnte nicht geladen werden.');
        }

        const matchData = await matchResponse.json();
        const tableData = await tableResponse.json();

        renderMatches(matchData);
        renderTable(tableData);

        // Letzte Aktualisierung anzeigen
        $('updated').textContent =
            'Aktualisiert: ' +
            new Date().toLocaleTimeString('de-DE', {
                hour: '2-digit',
                minute: '2-digit'
            }) +
            ' · OpenLigaDB';

    } catch (error) {

        console.error('Fehler beim Laden:', error);

        $('matches').innerHTML =
            '<div class="empty">Spieldaten konnten gerade nicht geladen werden. Bitte später erneut versuchen.</div>';

        $('tableWrap').textContent =
            'Tabelle konnte nicht geladen werden.';

        $('updated').textContent =
            'Verbindung zur Datenquelle fehlgeschlagen · OpenLigaDB';
    }
}


// Beim Öffnen laden
load();

// Alle fünf Minuten automatisch aktualisieren
setInterval(load, 5 * 60 * 1000);

</script>

</body>
</html>
