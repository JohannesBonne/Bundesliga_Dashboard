<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bundesliga Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#101722;--panel:#192433;--line:#2b3a4d;--muted:#9aabba;--accent:#65c6a4;--text:#edf3f8}
*{box-sizing:border-box}body{margin:0;padding:14px;background:linear-gradient(145deg,#101722,#172537);color:var(--text);font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-size:19px;margin:0;font-weight:750;letter-spacing:.2px}.sub{font-size:11px;color:var(--muted)}
.pill{font-size:10px;color:#bdebd9;border:1px solid #326b5b;background:#183a32;border-radius:99px;padding:4px 8px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr;gap:11px}
section{background:rgba(25,36,51,.94);border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:#c4d2df;margin:0 0 9px}
.muted{color:var(--muted)}.matches{display:grid;gap:7px}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:7px;padding:8px 9px;border-radius:9px;background:#202e40}
.team{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team:last-child{text-align:right}
.score{font-weight:800;font-size:15px;white-space:nowrap}.time{font-size:11px;color:var(--muted);text-align:center}
.live{color:#ff8585}.finished{color:#aebdca}
table{width:100%;border-collapse:collapse;font-size:12px}th{color:var(--muted);font-weight:600;text-align:right;padding:5px 3px}th:nth-child(2),td:nth-child(2){text-align:left}td{padding:6px 3px;border-top:1px solid #2a394b;text-align:right;font-variant-numeric:tabular-nums}tr.sch td{color:#8fe0bf;font-weight:750;background:#1b3b35}
.pos{width:20px;color:var(--muted);text-align:left!important}.teamcell{max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.footer{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:10px;color:var(--muted)}a{color:#9bdac5;text-decoration:none}a:hover{text-decoration:underline}
.status{font-size:11px;color:var(--muted);padding:3px 0}.empty{color:var(--muted);padding:10px 2px}
@media(min-width:600px){.grid{grid-template-columns:1.1fr .9fr}.grid section:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<header><div><h1>Bundesliga</h1><div class="sub">Spieltag · Ergebnisse · Tabelle</div></div><span class="pill">LIVE-DATEN</span></header>
<div class="grid">
<section><h2>Aktuelle & nächste Spiele</h2><div id="matches" class="matches"><div class="empty">Lade Spieldaten …</div></div></section>
<section><h2>Tabelle 2026/27</h2><div id="tablewrap" class="status">Lade Tabelle …</div></section>
</div>
<div class="footer"><span id="updated">Datenquelle: OpenLigaDB</span><a href="https://www.openligadb.de/" target="_blank" rel="noopener">Datenquelle ↗</a></div>
<script>
const API='https://api.openligadb.de';
const season=2026;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function result(m){
 const r=(m.matchResults||[]).filter(x=>x.resultTypeID===2||x.resultTypeID===1).sort((a,b)=>b.resultTypeID-a.resultTypeID)[0];
 return r?`${r.pointsTeam1} : ${r.pointsTeam2}`:'– : –';
}
function status(m){
 if(m.matchIsFinished)return '<span class="finished">Beendet</span>';
 const d=new Date(m.matchDateTime);
 if(d<=new Date())return '<span class="live">● LIVE / offen</span>';
 return esc(d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}))+' · '+esc(d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
}
function renderMatches(data){
 const now=Date.now();
 const upcoming=data.filter(m=>!m.matchIsFinished).sort((a,b)=>new Date(a.matchDateTime)-new Date(b.matchDateTime));
 const recent=data.filter(m=>m.matchIsFinished).sort((a,b)=>new Date(b.matchDateTime)-new Date(a.matchDateTime)).slice(0,3);
 const next=upcoming.slice(0,6);
 const shown=[...recent.slice(0,2).reverse(),...next];
 if(!shown.length){$('matches').innerHTML='<div class="empty">Aktuell keine Spieldaten vorhanden.</div>';return}
 $('matches').innerHTML=shown.map(m=>{
  const a=m.team1?.teamName||'Heim';const b=m.team2?.teamName||'Gast';
  const sch=/schalke/i.test(a+' '+b);
  const score=m.matchIsFinished||new Date(m.matchDateTime)<=new Date()?result(m):'vs';
  return `<div class="match" style="${sch?'outline:1px solid #4b9b7e;background:#1b3b35':''}">
   <div class="team">${esc(a)}</div><div style="text-align:center"><div class="score">${esc(score)}</div><div class="time">${status(m)}</div></div><div class="team">${esc(b)}</div>
  </div>`;
 }).join('');
}
function renderTable(rows){
 if(!rows?.length){$('tablewrap').textContent='Tabelle derzeit nicht verfügbar.';return}
 $('tablewrap').innerHTML=`<table><thead><tr><th>#</th><th>Verein</th><th>Sp</th><th>TD</th><th>Pkt</th></tr></thead><tbody>${rows.map((t,i)=>{
 const sch=/schalke/i.test(t.teamName||'');
 return `<tr class="${sch?'sch':''}"><td class="pos">${i+1}</td><td class="teamcell">${esc(t.teamName)}</td><td>${t.matches}</td><td>${t.goalDiff>0?'+':''}${t.goalDiff}</td><td><b>${t.points}</b></td></tr>`;
 }).join('')}</tbody></table>`;
}
async function load(){
 try{
  const [mr,tr]=await Promise.all([
   fetch(`${API}/getmatchdata/bl1/${season}`).then(r=>{if(!r.ok)throw Error('Spieldaten');return r.json()}),
   fetch(`${API}/getbltable/bl1/${season}`).then(r=>{if(!r.ok)throw Error('Tabelle');return r.json()})
  ]);
  renderMatches(mr);renderTable(tr);
  $('updated').textContent='Aktualisiert: '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' · OpenLigaDB';
 }catch(e){
  $('matches').innerHTML='<div class="empty">Daten konnten gerade nicht geladen werden. Bitte später neu laden.</div>';
  $('tablewrap').textContent='Tabelle konnte nicht geladen werden.';
  $('updated').textContent='Verbindung zur Datenquelle fehlgeschlagen · OpenLigaDB';
 }
}
load();setInterval(load,5*60*1000);
</script>
</body></html>
